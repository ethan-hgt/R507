name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: vendor
        key: composer-${{ hashFiles('composer.lock') }}
        
    - name: Install dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Prepare production files
      run: |
        cp .env.prod .env
        mkdir -p var/cache var/log
        touch var/data.db
        chmod -R 777 var/

    - name: Clear and warmup cache
      run: |
        php bin/console cache:clear --env=prod --no-debug
        php bin/console cache:warmup --env=prod --no-debug

    - name: Run database migrations
      run: |
        php bin/console doctrine:migrations:migrate --no-interaction --env=prod

    - name: Clean development files
      run: |
        rm -rf tests/
        rm -f .env.local .env.test .env.dev
        rm -f phpunit.xml phpunit.dist.xml
        rm -rf var/cache/dev var/cache/test
        rm -f composer.json composer.lock composer.phar

    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT || 21 }}
        protocol: ftp
        local-dir: ./
        server-dir: /
        dangerous-clean-slate: true
        exclude: |
          **/.git*
          **/.github/**
          **/node_modules/**
          **/tests/**
          **/.env.local
          **/.env.test
          **/.env.dev
          **/var/cache/dev/**
          **/var/cache/test/**
          README.md

    - name: Post-deployment notification
      run: |
        echo "Deployment completed successfully!"
